name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Git branch to deploy'
        required: false
        default: 'master'

jobs:
  deploy:
    name: Deploy API via Script
    runs-on: ubuntu-latest
    steps:
      - name: Execute deployment script on server
        uses: fifsky/ssh-action@master
        with:
          host: ${{ vars.PROD_SERVER_IP }}
          user: ${{ secrets.PROD_SERVER_USERNAME }}
          pass: ${{ secrets.PROD_SERVER_PASSWORD }}
          port: ${{ vars.PROD_SERVER_PORT }}
          command: |
            export DEPLOY_BRANCH="${{ github.event.inputs.branch || 'master' }}"
            bash ${{ vars.PROD_SERVER_WORKING_DIR_API }}/deploy.sh
